[pytest]
markers =
    fumaca: acessa os sites reais. Lento, exige Chromium e pode falhar por
        motivo alheio ao nosso código (site fora do ar, bloqueio, troca de
        layout). Rode sob demanda: pytest -m fumaca

# A suíte padrão fica offline e rápida — é ela que roda no CI a cada push.
# Os testes de fumaça são deliberadamente deselecionados aqui.
addopts = -m "not fumaca"
